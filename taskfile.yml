# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

env:
  PROJECT_ROOT:
    sh: pwd
  SQLC_HELPER:
    sh: python -c "import os; print(os.path.join(os.getcwd(), \"tools\", \"sqlc_helper.py\"), end=\"\")"
  GOENUM:
    sh: python -c "import os; print(os.path.join(os.getcwd(), \"tools\", \"goenum.py\"))"

tasks:
  generate:
    sources:
      - "**/*.go"
      - exclude: "**/*.gen.go"
      - exclude: "**/sqlgen/*"
    generates:
      - "**/*.gen.go"
      - "**/sqlgen/*"
      - docs/swagger.yaml
      - docs/swagger.json
    cmds:
      - go tool github.com/swaggo/swag/cmd/swag init -g cmd/backend/main.go
      - go generate ./...
  build:
    sources:
      - "**/*.go"
    generates:
      - bin/backend
      - bin/shoplannerctl
    deps: [generate]
    cmds:
      - go build -ldflags="-w -s" -o bin/backend ./cmd/backend
      - go build -ldflags="-w -s" -o bin/shoplannerctl ./cmd/shoplannerctl
  test:
    cmds:
      - go test ./... -race
  test:update:
    cmds:
      - go test ./internal/backend/functest/ -update
  why:
    desc: shows what makes a task re-run — glob matches and changed sources
    cmds:
      - python tools/task_why.py {{.CLI_ARGS}}
  lint:
    desc: "run linters"
    cmds:
      - golangci-lint run
  fmt:
    desc: "format the code"
    cmds:
      - swag fmt
      - go fmt ./...
  run:
    desc: "run backend service"
    deps: [build]
    cmds:
      - bin/backend --config config/backend.yml
  export:
    desc: "export docker image"
    deps:
      - build
    cmds:
      - docker buildx build -o type=docker,dest=- -t shoplanner-backend:latest . > shoplanner.tar
  package:deb:
    deps:
      - build
    desc: "build deb package"
    sources:
      - packaging/*
    generates:
      - dist/*
    cmds:
      - packaging/deb/build.sh
