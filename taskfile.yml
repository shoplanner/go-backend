version: "3"

env:
  PROJECT_ROOT:
    sh: pwd
  SQLC_HELPER:
    sh: python -c "import os; print(os.path.join(os.getcwd(), \"tools\", \"sqlc_helper.py\"), end=\"\")"
  GOENUM:
    sh: python -c "import os; print(os.path.join(os.getcwd(), \"tools\", \"goenum.py\"))"

tasks:
  generate:
    cmds:
      - go tool github.com/swaggo/swag/cmd/swag init -g cmd/backend/main.go
      - go generate ./...
      # - go tool github.com/go-swagger/go-swagger/cmd/swagger generate cli
  build:
    deps: [generate]
    cmds:
      # The package, not main.go alone: newLogWriter lives in the build-tagged logger_*.go siblings.
      - go build -ldflags="-w -s" -o bin/backend ./cmd/backend
  test:
    cmds:
      - go test ./... -race
  # Regenerates the committed artifacts under internal/backend/functest/testdata: the schema
  # snapshot, the golden domain models and the legacy database dump. Review the diff by hand.
  test:update:
    cmds:
      - go test ./internal/backend/functest/ -update
  lint:
    cmds:
      - golangci-lint run
  fmt:
    cmds:
      - swag fmt
      - go fmt ./...
  run:
    deps: [build]
    cmds:
      - bin/backend --config config/backend.yml
  export:
    cmds:
      - docker buildx build -o type=docker,dest=- -t shoplanner-backend:latest . > shoplanner.tar
  # Builds a .deb for Debian 13 (trixie) into dist/. Everything lives in the script; override
  # VERSION / REVISION / OUT_DIR through the environment.
  package:deb:
    cmds:
      - packaging/deb/build.sh
